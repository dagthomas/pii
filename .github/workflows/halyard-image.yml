# halyard: build and push to GHCR on every push to main. Kargo (kargo-<app>) sees the
# new SHA tag and promotes it to prod in github.com/dagthomas/halyard. Do not add a
# `latest` tag; deploys are always pinned to a commit.
name: halyard image
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, packages: write }
concurrency:
  group: halyard-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/dagthomas/pii:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=pii
          cache-to: type=gha,mode=max,scope=pii
